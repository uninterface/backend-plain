name: Publish Plain to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the verified package on npm for maintainer approval
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Verify release tag matches package version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$GITHUB_REF_NAME" == v0.0.0 ]]; then
            printf '::error::Expected a vMAJOR.MINOR.PATCH release tag with a nonzero version\n'
            exit 1
          fi
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Release tag %s does not match package.json version %s\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi
      - run: npm ci
      - name: Build, pack and inspect Plain
        env:
          PACK_DIR: ${{ runner.temp }}/plain-pack
        run: |
          mkdir -p "$PACK_DIR"
          npm run build
          npm pack ./dist/package --offline --ignore-scripts --json --pack-destination "$PACK_DIR" > "$PACK_DIR/pack.json"
          node scripts/check-package.mjs "$PACK_DIR/pack.json"
          mv "$PACK_DIR"/uninterface-backend-plain-*.tgz "$PACK_DIR/backend-plain.tgz"
      - name: Install, type-check and build a fresh consumer
        env:
          PACK_DIR: ${{ runner.temp }}/plain-pack
          CONSUMER_DIR: ${{ runner.temp }}/plain-consumer
        run: |
          core_version=$(node -p 'require("./package.json").devDependencies["@uninterface/uninterface"]')
          mkdir -p "$CONSUMER_DIR"
          cp -R tests/package-consumer/. "$CONSUMER_DIR/"
          cp "$PACK_DIR/backend-plain.tgz" "$CONSUMER_DIR/"
          cd "$CONSUMER_DIR"
          npm pkg set "dependencies.@uninterface/uninterface=$core_version"
          npm install --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
          npm ls @uninterface/uninterface vue --all
          npm run check
      - name: Rehearse publication and record integrity
        working-directory: ${{ runner.temp }}/plain-pack
        run: |
          npm publish ./backend-plain.tgz --dry-run --offline --ignore-scripts --access public --tag alpha
          sha512sum backend-plain.tgz > SHA512SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: uninterface-backend-plain-npm-package
          path: ${{ runner.temp }}/plain-pack/
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' || inputs.stage }}
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: uninterface-backend-plain-npm-package
          path: ${{ runner.temp }}/plain-pack
      - name: Verify the release tarball
        working-directory: ${{ runner.temp }}/plain-pack
        run: sha512sum --check SHA512SUMS
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
      - name: Publish the verified tarball to npm
        if: ${{ github.event_name == 'push' }}
        working-directory: ${{ runner.temp }}/plain-pack
        run: npm publish ./backend-plain.tgz --ignore-scripts --access public --tag alpha --registry https://registry.npmjs.org/
      - name: Stage the verified tarball on npm
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ runner.temp }}/plain-pack
        run: npm stage publish ./backend-plain.tgz --access public --tag alpha --registry https://registry.npmjs.org/
